# The core suite, the §3.8 acceptance experiments, and the renderer in
# software.
#
# Note which remote this actually runs on.  The canonical remote is the
# self-hosted Git instance and this repository is only pushed here for
# releases, so this workflow fires on release pushes rather than on every
# commit.  `.forgejo/workflows/tests.yml` is the same suite on the
# upstream, and that is the one that gates day-to-day work.
#
# Nothing here needs a GPU: the renderer is tested against Mesa's software
# rasteriser, which is a real GL 4.5 core implementation and has already
# caught one bug the GPU path could not (SBCL's float traps versus a JIT
# rasteriser — see src/render/egl.lisp).

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older run irrelevant, except on main where the
# result is a record rather than a check.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      # Quicklisp is cached by its dist version rather than by date, so a
      # cache hit means the same library versions and not merely a recent
      # download.
      - name: Cache Quicklisp
        id: ql-cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}-v1

      # Unconditional, and deliberately not skipped on a cache hit.
      #
      # `ql:add-to-init-file` writes ~/.sbclrc, and ~/.sbclrc is not under
      # the cached path.  So a cache *miss* installs Quicklisp and wires it
      # up, while a cache *hit* restores ~/quicklisp and leaves SBCL with no
      # idea it is there — and every later step dies with "Package QL does
      # not exist".  That failure cannot happen on the first run of a new
      # cache key and is certain on the second, which is the worst shape a
      # CI bug can have; it cost a release build once already.
      #
      # Making the step idempotent rather than conditional demotes the cache
      # to what it should always have been: an optimisation for the
      # download, never a thing correctness depends on.
      - name: Install Quicklisp
        run: |
          set -eu
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -fsSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)'
          fi
          grep -qs 'quicklisp/setup.lisp' "$HOME/.sbclrc" 2>/dev/null ||
            echo '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
              >> "$HOME/.sbclrc"
          sbcl --non-interactive \
            --eval '(format t "~&quicklisp dist ~a~%" (ql:dist-version "quicklisp"))'

      - name: Core suite
        run: make test

      # The two rows that are published experiments rather than properties
      # of a function: Deneubourg's binary bridge and Goss's double bridge.
      # Several simulated colony-minutes per seed, so about half a minute.
      - name: Acceptance experiments (§3.8)
        run: make acceptance

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libgl1 libegl1 libgbm1 \
                                  libglx-mesa0 mesa-utils libglfw3

      - name: Cache Quicklisp
        id: ql-cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}-v1

      # Unconditional, and deliberately not skipped on a cache hit.
      #
      # `ql:add-to-init-file` writes ~/.sbclrc, and ~/.sbclrc is not under
      # the cached path.  So a cache *miss* installs Quicklisp and wires it
      # up, while a cache *hit* restores ~/quicklisp and leaves SBCL with no
      # idea it is there — and every later step dies with "Package QL does
      # not exist".  That failure cannot happen on the first run of a new
      # cache key and is certain on the second, which is the worst shape a
      # CI bug can have; it cost a release build once already.
      #
      # Making the step idempotent rather than conditional demotes the cache
      # to what it should always have been: an optimisation for the
      # download, never a thing correctness depends on.
      - name: Install Quicklisp
        run: |
          set -eu
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -fsSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)'
          fi
          grep -qs 'quicklisp/setup.lisp' "$HOME/.sbclrc" 2>/dev/null ||
            echo '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
              >> "$HOME/.sbclrc"
          sbcl --non-interactive \
            --eval '(format t "~&quicklisp dist ~a~%" (ql:dist-version "quicklisp"))'

      - name: Renderer suite (software rasteriser)
        run: make test-render-ci

      # Here rather than in the `test` job because antsim/app reaches
      # antsim/live, and cl-glfw3 opens libglfw when it is loaded — this
      # is the job that already has a graphics stack.  It opens no window
      # and needs no GPU; what it checks is argv and the scenario search
      # path, which is the half of the shipped binary that a release's own
      # smoke test cannot reach.
      - name: Command-line suite
        run: make test-app-bare

  # The gallery's weight — documentation rather than code, so neither SBCL
  # nor a graphics stack is involved.  The same job as the one in
  # .forgejo/workflows/tests.yml, calling the same script.
  #
  # `make gallery` renders PNG and converts to JPEG with ImageMagick,
  # because src/render/png.lisp emits stored deflate blocks: a 640x448
  # frame is 860 kB of raw RGB and the hero was 3 MB.  A picture added by
  # hand skips that step, and the only symptom is a page that loads slowly
  # — which nobody reports.  Here it is a red cross instead.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `identify` comes from imagemagick; the script uses it to name the
      # format and dimensions next to the byte count, so a failure says
      # which picture is at fault and what it is.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Gallery is web-sized
        run: ./scripts/check-images.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and GLFW
        run: brew install sbcl glfw

      - name: Cache Quicklisp
        id: ql-cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}-v1

      - name: Install Quicklisp
        run: |
          set -eu
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -fsSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)'
          fi
          grep -qs 'quicklisp/setup.lisp' "$HOME/.sbclrc" 2>/dev/null ||
            echo '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
              >> "$HOME/.sbclrc"
          sbcl --non-interactive \
            --eval '(format t "~&quicklisp dist ~a~%" (ql:dist-version "quicklisp"))'

      - name: Core suite
        run: make test

      - name: Acceptance experiments (§3.8)
        run: make acceptance

      - name: Command-line suite
        run: make test-app-bare

