# The Linux packaging, on the canonical remote.
#
# What this does and, more importantly, what it does not.  It builds the
# AppImage and proves it starts.  It does not publish a release: releases
# live on the GitHub mirror, where .github/workflows/release.yml builds
# both platforms from the same tag and attaches them to the Releases page.
#
# The reason is not that Forgejo cannot host a release — it can.  It is
# that two release pipelines produce two AppImages, and two AppImages
# built on two base images have two different glibc floors, so "the 1.0.0
# Linux build" would name two files that are not the same file and only
# one of which runs on Ubuntu 22.04.  One publisher, one artefact.
#
# So what is this for?  Day-to-day work lands here and almost never on
# GitHub, which means a change that breaks the packaging would otherwise
# be discovered by pushing a tag to the mirror — the one moment when
# discovering it is most expensive.  This runs on the tag *here* first,
# and on demand while the packaging is being changed.
#
# Needs a registered Actions runner.  With none this file is inert, which
# costs nothing.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  appimage:
    runs-on: docker
    # The same image as tests.yml, for the same reason: it has node, which
    # the runner needs to execute JS actions, plus a package manager.
    # Note that this makes the glibc floor Debian 12's rather than Ubuntu
    # 22.04's — one more reason the artefact from here is a check and not
    # the release.
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sbcl make curl ca-certificates file zstd \
            libglfw3 libgl1 libegl1

      - name: Cache Quicklisp
        id: ql-cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-release-linux-v1

      - name: Install Quicklisp
        if: steps.ql-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))'

      # The same check the mirror does, done here first: a tag whose
      # version disagrees with antsim.asd is a bad tag, and finding that
      # out on the remote nobody pushes to is finding it out too late.
      - name: Check the tag against antsim.asd
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          asd="$(sed -n 's/.*:version *"\([^"]*\)".*/\1/p' antsim.asd | head -1)"
          tag="${GITHUB_REF#refs/tags/}"
          if [ "${tag#v}" != "$asd" ]; then
            echo "tag $tag says ${tag#v}, antsim.asd says $asd" >&2
            exit 1
          fi
          echo "tag $tag agrees with antsim.asd"

      - name: Command-line suite
        run: make test-app-bare

      - name: Build the AppImage
        run: make appimage-bare HEAP=4096

      - name: Smoke-test it
        run: |
          set -eux
          img="$(ls dist/*.AppImage)"
          "$img" --appimage-extract >/dev/null
          ./squashfs-root/AppRun --version
          ./squashfs-root/AppRun --list
          ./squashfs-root/AppRun --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
