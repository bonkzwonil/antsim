# The same suites as .github/workflows/tests.yml, on the canonical remote.
#
# This is the one that gates day-to-day work: routine pushes go here, and
# the GitHub copy only fires on the manual release mirror.  Both exist
# because neither alone covers both remotes, and a test that only runs
# where the code rarely lands is not a test anybody relies on.
#
# Needs a registered Actions runner with a container image that has curl
# and a package manager; the default `node:20-bookworm` image does. If no
# runner is registered this file is inert, which costs nothing.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: apt-get update && apt-get install -y sbcl curl

      - name: Cache Quicklisp
        id: ql-cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-linux-v1

      # Unconditional, and deliberately not skipped on a cache hit.
      #
      # `ql:add-to-init-file` writes ~/.sbclrc, and ~/.sbclrc is not under
      # the cached path.  So a cache *miss* installs Quicklisp and wires it
      # up, while a cache *hit* restores ~/quicklisp and leaves SBCL with no
      # idea it is there — and every later step dies with "Package QL does
      # not exist".  That failure cannot happen on the first run of a new
      # cache key and is certain on the second, which is the worst shape a
      # CI bug can have; it cost a release build once already.
      #
      # Making the step idempotent rather than conditional demotes the cache
      # to what it should always have been: an optimisation for the
      # download, never a thing correctness depends on.
      - name: Install Quicklisp
        run: |
          set -eu
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -fsSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)'
          fi
          grep -qs 'quicklisp/setup.lisp' "$HOME/.sbclrc" 2>/dev/null ||
            echo '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
              >> "$HOME/.sbclrc"
          sbcl --non-interactive \
            --eval '(format t "~&quicklisp dist ~a~%" (ql:dist-version "quicklisp"))'

      - name: Core suite
        run: make test

      # Deneubourg's binary bridge and Goss's double bridge, as
      # experiments, with the papers' own criteria (§3.8).
      - name: Acceptance experiments (§3.8)
        run: make acceptance

  render:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and Mesa
        run: |
          apt-get update
          apt-get install -y sbcl curl libgl1 libegl1 libgbm1 \
                             libglx-mesa0 mesa-utils libglfw3

      - name: Cache Quicklisp
        id: ql-cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-linux-v1

      # Unconditional, and deliberately not skipped on a cache hit.
      #
      # `ql:add-to-init-file` writes ~/.sbclrc, and ~/.sbclrc is not under
      # the cached path.  So a cache *miss* installs Quicklisp and wires it
      # up, while a cache *hit* restores ~/quicklisp and leaves SBCL with no
      # idea it is there — and every later step dies with "Package QL does
      # not exist".  That failure cannot happen on the first run of a new
      # cache key and is certain on the second, which is the worst shape a
      # CI bug can have; it cost a release build once already.
      #
      # Making the step idempotent rather than conditional demotes the cache
      # to what it should always have been: an optimisation for the
      # download, never a thing correctness depends on.
      - name: Install Quicklisp
        run: |
          set -eu
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -fsSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)'
          fi
          grep -qs 'quicklisp/setup.lisp' "$HOME/.sbclrc" 2>/dev/null ||
            echo '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
              >> "$HOME/.sbclrc"
          sbcl --non-interactive \
            --eval '(format t "~&quicklisp dist ~a~%" (ql:dist-version "quicklisp"))'

      - name: Renderer suite (software rasteriser)
        run: make test-render-ci

      # The shipped binary's command line.  Here rather than in the `test`
      # job because antsim/app reaches antsim/live and cl-glfw3 opens
      # libglfw when it is loaded; this is the job that already has a
      # graphics stack.  No window, no GPU.
      - name: Command-line suite
        run: make test-app-bare
